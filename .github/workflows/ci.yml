name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          # Allow sourcing files dynamically (modules are sourced from bootstrap.sh)
          # SC1091: not following sourced files (acceptable — they're checked individually)
          # SC1090: can't follow non-constant source (modules sourced dynamically by design)
          # SC2034: appears unused (zsh-plugin-consumed vars in dotfiles/)
          # SC2155: declare and assign separately (style preference, not a bug)
          SHELLCHECK_OPTS: -e SC1090 -e SC1091 -e SC2034 -e SC2155 -x
        with:
          scandir: '.'
          # Skip generated/external content
          ignore_paths: >-
            tests/bats
            tests/bats-assert
            tests/bats-support

  bats:
    name: Bats Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: brew install bats-core

      - name: Run bats tests
        run: bats tests/

  shfmt:
    name: shfmt (formatting check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          # Pin a specific version + use the explicit /releases/download/v$VER
          # path. Earlier this used `latest/download/...` which 302s to whatever
          # the current release is — but the asset filename hardcoded
          # `shfmt_v3.8.0_linux_amd64`, which 404s once that exact filename
          # rotates out. The 404 HTML body was being saved as /tmp/shfmt and
          # executed, producing the cryptic `Not: command not found` error
          # (the first word of "Not Found" being run as a shell command).
          #
          # Two fixes combined:
          #   1. Pin SHFMT_VERSION + use /releases/download/v$VER/<asset>
          #      so URL and filename agree.
          #   2. Use `curl -fsSL` (capital -f): fail on HTTP errors instead
          #      of saving the error body. -s silences progress, -L follows
          #      redirects.
          #
          # Pattern lifted from ~/code/scripts/.github/workflows/ci.yml.
          SHFMT_VERSION="3.13.1"
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Check formatting
        run: shfmt -d -i 2 -ci -bn bootstrap.sh lib/ modules/ config/ dotfiles/
