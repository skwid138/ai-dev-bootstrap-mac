name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck (.sh files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: |
          # Retry + --fix-missing — apt on GHA ubuntu-latest flakes ~5% of runs
          # at install time. Lifted from personal-plan rev. 6 Phase 4.7 (commit
          # 9ed01d8). Without retry, transient mirror failures fail the whole job.
          for attempt in 1 2 3; do
            if sudo apt-get update \
              && sudo apt-get install -y --fix-missing shellcheck; then
              exit 0
            fi
            echo "apt attempt $attempt failed; sleeping 5s" >&2
            sleep 5
          done
          exit 1

      - name: Run shellcheck on .sh files
        run: |
          # SC1090: dynamic source by design (bootstrap.sh sources modules/*.sh by computed name).
          # SC1091: don't follow sourced files individually — they're checked on their own.
          # SC2034: dotfiles/zsh_*.sh used to define vars consumed by external zsh plugins.
          #         The .sh files are gone post-Phase-1; SC2034 is now defensive — kept so
          #         the lib/*.sh and modules/*.sh stays clean if a future helper does the same.
          # SC2155: stylistic preference, not a bug class.
          shellcheck -e SC1090 -e SC1091 -e SC2034 -e SC2155 -x \
            bootstrap.sh lib/*.sh modules/*.sh config/*.sh

  zsh-syntax:
    name: zsh -n (.zsh files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install zsh
        run: |
          # Retry + --fix-missing — same apt flakiness rationale as the shellcheck job.
          for attempt in 1 2 3; do
            if sudo apt-get update \
              && sudo apt-get install -y --fix-missing zsh; then
              exit 0
            fi
            echo "apt attempt $attempt failed; sleeping 5s" >&2
            sleep 5
          done
          exit 1

      - name: Parse-check every .zsh file
        run: |
          # zsh -n: parse-only, no execution. Catches syntax errors that shellcheck
          # cannot lint (it dropped zsh support in v0.11.0). This is the dialect-aware
          # gate for dotfiles/ after the three-tier refactor.
          fail=0
          while IFS= read -r f; do
            if zsh -n "$f"; then
              echo "OK:   $f"
            else
              echo "FAIL: $f" >&2
              fail=1
            fi
          done < <(find dotfiles -type f -name '*.zsh')
          exit $fail

  bats:
    name: Bats Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bats-core
        run: brew install bats-core

      - name: Run bats tests
        run: bats tests/

  # Cheap per-PR smoke test: catches bootstrap parse/logic errors without
  # installing anything. Full e2e coverage lives in e2e-launcher.yml behind
  # the `e2e` label.
  smoke:
    name: Smoke test (dry-run)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run bootstrap --dry-run (essential tier)
        run: AI_BOOTSTRAP_NONINTERACTIVE=1 AI_BOOTSTRAP_TIER=essential ./bootstrap.sh --dry-run

  shfmt:
    name: shfmt (formatting check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shfmt
        run: |
          # Pin a specific version + use the explicit /releases/download/v$VER
          # path. Earlier this used `latest/download/...` which 302s to whatever
          # the current release is — but the asset filename hardcoded
          # `shfmt_v3.8.0_linux_amd64`, which 404s once that exact filename
          # rotates out. The 404 HTML body was being saved as /tmp/shfmt and
          # executed, producing the cryptic `Not: command not found` error
          # (the first word of "Not Found" being run as a shell command).
          #
          # Two fixes combined:
          #   1. Pin SHFMT_VERSION + use /releases/download/v$VER/<asset>
          #      so URL and filename agree.
          #   2. Use `curl -fsSL` (capital -f): fail on HTTP errors instead
          #      of saving the error body. -s silences progress, -L follows
          #      redirects.
          #
          # Pattern lifted from ~/code/scripts/.github/workflows/ci.yml.
          SHFMT_VERSION="3.13.1"
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Check formatting (.sh files)
        run: shfmt -d -i 2 -ci -bn bootstrap.sh lib/ modules/ config/

      - name: Check formatting (dotfiles/, dialect auto-detected from .zsh extension)
        run: shfmt -d -i 2 -ci -bn dotfiles/
