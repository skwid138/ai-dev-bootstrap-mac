# End-to-end verification on a clean macos-latest runner.
#
# Spec: zsh_init_plan.md §6.5 (rev-4) + §9 Phase 8.
#
# Why workflow_dispatch + e2e label only (not on every push):
#   A full run is ~5 min (full bootstrap install + zsh -l shell start +
#   re-run for idempotency + launcher rebuild). Gating behind a manual
#   trigger / explicit PR label avoids burning CI minutes on every commit
#   while keeping the workflow reachable when an actual change needs
#   end-to-end coverage. See §10 risk row "GHA e2e-launcher.yml flakes".
#
# Why this is the sole end-to-end gate:
#   The author's dev machine is not a clean install target — the
#   installer must never run there (zsh_init_plan.md §0 hard rules).
#   This workflow on a fresh macos-latest VM is the only place a real
#   ./bootstrap.sh invocation is exercised end to end.
#
# What this workflow CANNOT cover (deferred per §9 Phase 8):
#   The Spotlight launch test (§6.4 #5) needs a real GUI session;
#   macOS GHA runners are headless. Documented as SKIPPED in §B.
#   The headless launcher exec was considered and dropped: the
#   bats suite + the static-grep step on Contents/MacOS/launch
#   already cover what a headless exec would (and the bundle can't
#   open a real window on a headless VM anyway).

name: e2e-launcher

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, opened, synchronize]

jobs:
  e2e:
    # Fire on manual dispatch always. On PRs, fire only when the `e2e`
    # label is present — the label trigger above ensures a labeled PR
    # re-runs the workflow when newly labeled.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Verify clean machine
        run: |
          # GHA macos-latest runners ship without ai-bootstrap. Sanity-check
          # so a future runner-image change that pre-installs anything
          # surfaces here as an obvious failure rather than as a confusing
          # idempotency-test miss later.
          test ! -d "$HOME/.config/ai-bootstrap" || {
            echo "FAIL: $HOME/.config/ai-bootstrap already exists on the runner" >&2
            exit 1
          }
          if [ -f "$HOME/.zshenv" ] && grep -q "ai-bootstrap" "$HOME/.zshenv"; then
            echo "FAIL: ~/.zshenv already references ai-bootstrap on the runner" >&2
            exit 1
          fi

      - name: Run bootstrap (essential tier, headless)
        run: |
          # Headless mode: AI_BOOTSTRAP_NONINTERACTIVE skips prompts;
          # AI_BOOTSTRAP_TIER picks the install tier without UI.
          # Essential tier is the cheapest (smallest install surface)
          # while still exercising the unconditional shell-config
          # module (§5.1 rev-3 fix: Essential users now get the
          # three-tier dotfiles too).
          AI_BOOTSTRAP_NONINTERACTIVE=1 \
          AI_BOOTSTRAP_TIER=essential \
          MISE_PYTHON_GITHUB_ATTESTATIONS=false \
            ./bootstrap.sh

      - name: Verify three-tier files installed
        run: |
          # The three barrels must land in the install dir.
          test -f "$HOME/.config/ai-bootstrap/shell/init_env.zsh"
          test -f "$HOME/.config/ai-bootstrap/shell/init_profile.zsh"
          test -f "$HOME/.config/ai-bootstrap/shell/init_rc.zsh"

          # Each shell init target must reference ai-bootstrap (the
          # `# ai-bootstrap` comment header — see modules/10-shell-config.sh).
          grep -q "ai-bootstrap" "$HOME/.zshenv"
          grep -q "ai-bootstrap" "$HOME/.zprofile"
          grep -q "ai-bootstrap" "$HOME/.zshrc"

      - name: Verify two-line blocks in each shell init target
        run: |
          # Per module: one `# ai-bootstrap` comment + one source line per
          # file. Assert exactly one of each so a future module change that
          # accidentally double-emits surfaces here.
          for f in "$HOME/.zshenv" "$HOME/.zprofile" "$HOME/.zshrc"; do
            comments=$(grep -c '^# ai-bootstrap$' "$f" || true)
            if [ "$comments" -ne 1 ]; then
              echo "FAIL: $f has $comments '# ai-bootstrap' headers (expected 1)" >&2
              exit 1
            fi
          done

          # Each target sources its tier-specific barrel exactly once.
          test "$(grep -c 'init_env.zsh' "$HOME/.zshenv")" -eq 1
          test "$(grep -c 'init_profile.zsh' "$HOME/.zprofile")" -eq 1
          test "$(grep -c 'init_rc.zsh' "$HOME/.zshrc")" -eq 1

      - name: PATH ordering check (path_helper recovery)
        run: |
          # `zsh -l` is a login shell — exercises the macOS path_helper
          # demotion that runs from /etc/zprofile between zshenv and
          # zprofile, plus the recovery via _path_prepend's promotion
          # semantics in init_profile.zsh (§3.6 / §C2).
          #
          # The semantic we care about: did path_helper recovery work?
          # path_helper would put /usr/bin BEFORE /opt/homebrew/bin if
          # init_profile.zsh failed to re-source env-tier. Verify by
          # asserting /opt/homebrew/bin appears, AND it appears before
          # /usr/bin.
          #
          # We don't assert /opt/homebrew/bin is the *first* entry on PATH:
          # mise's profile-tier activation (profile/tool_hooks.zsh) runs
          # AFTER env-tier and prepends its own shim paths
          # (~/.local/share/mise/installs/<tool>/bin), which is the
          # desired behavior for runtime version management. Asserting
          # "Homebrew first" would fail for any tier that includes mise
          # (essential, recommended, complete — i.e. all of them).
          full_path=$(zsh -l -c 'echo $PATH')
          echo "Full PATH: $full_path"

          case ":$full_path:" in
            *:/opt/homebrew/bin:* | *:/usr/local/bin:*)
              : # Homebrew bin present — continue
              ;;
            *)
              echo "FAIL: neither /opt/homebrew/bin nor /usr/local/bin appear on PATH" >&2
              exit 1
              ;;
          esac

          # path_helper recovery check: Homebrew bin must appear before
          # /usr/bin. Compute character offsets; smaller = earlier.
          brew_idx=$(printf '%s' "$full_path" | awk -v RS=: '/^\/opt\/homebrew\/bin$/ || /^\/usr\/local\/bin$/ {print NR; exit}')
          usrbin_idx=$(printf '%s' "$full_path" | awk -v RS=: '/^\/usr\/bin$/ {print NR; exit}')
          echo "Homebrew bin field: $brew_idx; /usr/bin field: $usrbin_idx"
          if [ -z "$brew_idx" ] || [ -z "$usrbin_idx" ]; then
            echo "FAIL: could not locate one of Homebrew bin / /usr/bin in PATH" >&2
            exit 1
          fi
          if [ "$brew_idx" -ge "$usrbin_idx" ]; then
            echo "FAIL: Homebrew bin (field $brew_idx) is NOT before /usr/bin (field $usrbin_idx) — path_helper demotion not recovered" >&2
            exit 1
          fi
          echo "PASS: Homebrew bin (field $brew_idx) precedes /usr/bin (field $usrbin_idx)"

      - name: Verify command -v bash resolves to Homebrew bash
        run: |
          # If PATH ordering is broken, bash resolves to /bin/bash (3.2).
          # Real Homebrew bash lives at $BREW_PREFIX/bin/bash. This is the
          # canonical regression test for the launcher's PATH contract.
          resolved=$(zsh -l -c 'command -v bash')
          case "$resolved" in
            /opt/homebrew/bin/bash | /usr/local/bin/bash)
              echo "PASS: $resolved"
              ;;
            *)
              echo "FAIL: bash resolves to '$resolved' (expected Homebrew bash, got system bash 3.2 path)" >&2
              exit 1
              ;;
          esac

      - name: --check-paths exit code
        run: |
          # Read-only staleness check. After a fresh install the baked
          # prefix matches the resolved one — expected exit 0 + 'fresh'.
          # See lib/paths_check.sh for the exit-code contract.
          out=$(./bootstrap.sh --check-paths)
          rc=$?
          echo "stdout: $out"
          echo "exit:   $rc"
          test "$rc" -eq 0
          echo "$out" | grep -q '^fresh'

      - name: Re-run bootstrap (idempotency)
        run: |
          # Second run with the same tier. Module re-emits source lines
          # but append_line_if_missing must dedupe — counts stay at 1.
          AI_BOOTSTRAP_NONINTERACTIVE=1 \
          AI_BOOTSTRAP_TIER=essential \
          MISE_PYTHON_GITHUB_ATTESTATIONS=false \
            ./bootstrap.sh

          test "$(grep -c 'init_env.zsh' "$HOME/.zshenv")" -eq 1
          test "$(grep -c 'init_profile.zsh' "$HOME/.zprofile")" -eq 1
          test "$(grep -c 'init_rc.zsh' "$HOME/.zshrc")" -eq 1
          test "$(grep -c '^# ai-bootstrap$' "$HOME/.zshenv")" -eq 1
          test "$(grep -c '^# ai-bootstrap$' "$HOME/.zprofile")" -eq 1
          test "$(grep -c '^# ai-bootstrap$' "$HOME/.zshrc")" -eq 1

      - name: Rebuild JustVibes.app (launcher-only)
        run: |
          # --launcher-only does NOT install Ghostty; it just produces the
          # .app bundle from launcher/launch.sh. Used here to inspect the
          # built launcher script in the bundle (the Phase 6.5 static-grep
          # regression gate).
          ./bootstrap.sh --launcher-only

      - name: Static grep on built launcher (Phase 6.5 / rev-8 / Branch F regression gate)
        run: |
          # Branch F (launcher_improvement_plan.md §8): the bundle is now
          # an osacompile-built AppleScript applet. The bash logic moved
          # from Contents/MacOS/launch to Contents/Resources/launch-helper.sh;
          # CFBundleExecutable is now `applet` (the AppleScript runtime
          # Mach-O — NOT a script we can grep). The regression assertions
          # below run against the helper script, plus a fresh set of
          # AppleScript-host gates against the committed source.
          #
          # On macos-latest /Applications is writable so the bundle lands
          # there; on locked-down Macs it falls back to ~/Applications.
          # Try /Applications first then ~/Applications.
          app="/Applications/JustVibes.app"
          test -d "$app" || app="$HOME/Applications/JustVibes.app"
          test -d "$app" || {
            echo "FAIL: JustVibes.app not found in /Applications or ~/Applications" >&2
            exit 1
          }

          # Branch F bundle structure: applet executable + helper script.
          applet="$app/Contents/MacOS/applet"
          helper="$app/Contents/Resources/launch-helper.sh"
          scpt="$app/Contents/Resources/Scripts/main.scpt"
          icns="$app/Contents/Resources/JustVibes.icns"
          for required in "$applet" "$helper" "$scpt" "$icns"; do
            test -e "$required" || {
              echo "FAIL: required bundle file missing: $required" >&2
              exit 1
            }
          done
          test -x "$applet" || {
            echo "FAIL: $applet is not executable" >&2
            exit 1
          }
          test -x "$helper" || {
            echo "FAIL: $helper is not executable" >&2
            exit 1
          }

          # Default-icon ambiguity (osacompile's applet.icns + Assets.car)
          # must be removed by build.sh — otherwise modern macOS asset
          # catalog resolution may prefer the default applet icon over
          # our piggy-bank. See launcher_improvement_plan.md §1.5.3.
          for forbidden in \
            "$app/Contents/Resources/applet.icns" \
            "$app/Contents/Resources/Assets.car"; do
            if [ -e "$forbidden" ]; then
              echo "FAIL: default-icon ambiguity not cleaned: $forbidden present" >&2
              exit 1
            fi
          done

          # Branch F bundle identity. CFBundleIdentifier must be distinct
          # from Ghostty's `com.mitchellh.ghostty` so LaunchServices treats
          # JustVibes as its own app (separate Dock tile, separate TCC
          # entry, separate Cmd-Tab card). Both icon keys must point at
          # JustVibes (modern macOS may prefer CFBundleIconName).
          plist="$app/Contents/Info.plist"
          want_id="dev.aibootstrap.justvibes"
          got_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$plist")
          if [ "$got_id" != "$want_id" ]; then
            echo "FAIL: CFBundleIdentifier=$got_id (expected $want_id)" >&2
            exit 1
          fi
          got_name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleName" "$plist")
          if [ "$got_name" != "JustVibes" ]; then
            echo "FAIL: CFBundleName=$got_name (expected 'JustVibes')" >&2
            exit 1
          fi
          got_iconfile=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$plist")
          got_iconname=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconName" "$plist")
          if [ "$got_iconfile" != "JustVibes" ] || [ "$got_iconname" != "JustVibes" ]; then
            echo "FAIL: icon keys mismatch (file=$got_iconfile, name=$got_iconname; both expected JustVibes)" >&2
            exit 1
          fi

          # Bundle must be ad-hoc-signed with the JustVibes identifier
          # post-plist-edit. Without re-signing, macOS Gatekeeper refuses
          # to launch.
          if ! codesign -dv "$app" 2>&1 | grep -q "Identifier=$want_id"; then
            echo "FAIL: bundle is not signed with Identifier=$want_id" >&2
            codesign -dv "$app" >&2 || true
            exit 1
          fi

          echo "Inspecting helper: $helper"

          # Phase 6 (commit f3852cd): launcher must use --command=zsh -l,
          # not -e. Asserts the post-Phase-6 arg shape.
          grep -qF -- '--command=zsh -l' "$helper" || {
            echo "FAIL: helper missing '--command=zsh -l' (Phase 6 regression)" >&2
            exit 1
          }

          # Phase 6.5 / rev-8 (commit d959cc5): -Fa flag cluster suppresses
          # window restoration AND keeps -a positioned to consume the next
          # token as its app argument. The plan's prescribed -naF was an
          # erratum (see top-of-file note in zsh_init_plan.md) — macOS 26.x
          # parses -naF such that Ghostty.app becomes a positional file
          # path.
          #
          # Phase 6.6 (launcher_improvement_plan.md §1.5.4.2): the `-n`
          # flag is now CONDITIONAL on Ghostty's running state. From a
          # `.app`-bundle context (Finder/Dock/Spotlight launches), passing
          # `-n` cold-state spawns an extra bare ghostty process alongside
          # the flagged one — the original "no window" symptom. We detect
          # via `osascript -e 'running of application "Ghostty"'` and only
          # add `-n` if Ghostty is already running. The grep below asserts
          # the `-Fa` cluster is present (always required) and the
          # detection call is wired up.
          grep -qF -- '-Fa' "$helper" || {
            echo "FAIL: helper missing '-Fa' (Phase 6.5 fresh-launch regression)" >&2
            exit 1
          }
          grep -qF -- 'running of application' "$helper" || {
            echo "FAIL: helper missing 'running of application' detection (Phase 6.6 conditional-n regression — see launcher_improvement_plan.md §1.5.4.2)" >&2
            exit 1
          }

          # Phase 6.5 / rev-8: --title=JustVibes identifies the spawned
          # window as launcher-originated. Tags the window in the title bar
          # and reinforces the "JustVibes is its own thing" UX.
          grep -qF -- '--title=JustVibes' "$helper" || {
            echo "FAIL: helper missing '--title=JustVibes' (Phase 6.5 regression)" >&2
            exit 1
          }

          # Phase 6.5 / rev-8: negative regression assertion. Bare '-na '
          # (with trailing space) without -F would re-introduce the
          # window-restore behavior. The flag-cluster forms '-Fa' / '-nFa'
          # contain the substring '-Fa', not '-na ', so this assertion stays
          # clean.
          if grep -qF -- '-na ' "$helper"; then
            echo "FAIL: helper contains bare '-na ' (Phase 6.5 fresh-launch regression — -F must be in the cluster)" >&2
            grep -nF -- '-na ' "$helper" >&2 || true
            exit 1
          fi

          # rev-6 / Branch F constraint (launcher_improvement_plan.md
          # §1.5.4.3 + §1.5.6) + Branch F.1 (§8.7): the AppleScript host
          # source MUST NOT use `tell application "Ghostty"`,
          # `tell application id "com.mitchellh…"`, or
          # `exists application "Ghostty"`. All three compile to
          # LaunchServices bundle-resolution calls that LAUNCH Ghostty as
          # a side effect — the original ghost-process bug that motivated
          # Phase 6.6 in the first place. `tell application "System
          # Events"` IS allowed: System Events is an Apple-shipped
          # automation broker that's always running, not a LaunchServices
          # bundle target. Strip AppleScript line comments (-- to end of
          # line) before grepping so the source's documentation
          # explaining WHY the constructs are banned doesn't trigger the
          # gate.
          src="launcher/launch.applescript"
          test -f "$src" || {
            echo "FAIL: $src missing (committed Branch F source-of-truth)" >&2
            exit 1
          }
          stripped=$(sed -E 's/--.*$//' "$src")
          if echo "$stripped" | grep -qE 'tell[[:space:]]+application[[:space:]]+"Ghostty"'; then
            echo "FAIL: $src contains banned 'tell application \"Ghostty\"' (Branch F rev-6 regression — see launcher_improvement_plan.md §1.5.4.3 Test 5)" >&2
            grep -nE 'tell[[:space:]]+application[[:space:]]+"Ghostty"' "$src" >&2 || true
            exit 1
          fi
          if echo "$stripped" | grep -qE 'tell[[:space:]]+application[[:space:]]+id[[:space:]]+"com\.mitchellh'; then
            echo "FAIL: $src contains banned 'tell application id \"com.mitchellh…\"' (Branch F rev-6 regression — see launcher_improvement_plan.md §1.5.4.3)" >&2
            grep -nE 'tell[[:space:]]+application[[:space:]]+id[[:space:]]+"com\.mitchellh' "$src" >&2 || true
            exit 1
          fi
          if echo "$stripped" | grep -qE 'exists[[:space:]]+application[[:space:]]+"Ghostty"'; then
            echo "FAIL: $src contains banned 'exists application \"Ghostty\"' (Branch F rev-6 regression — see launcher_improvement_plan.md §1.5.4.3 Test 5)" >&2
            grep -nE 'exists[[:space:]]+application[[:space:]]+"Ghostty"' "$src" >&2 || true
            exit 1
          fi

          # Branch F.1 / §8.7: the `on reopen` Cmd-Tab focus handler
          # must be present. Without it, Cmd-Tabbing to "JustVibes"
          # while the applet is already running does nothing visible
          # (the applet has no UI window) — the cosmetic gap §8.7 fixes.
          if ! echo "$stripped" | grep -qE '^[[:space:]]*on[[:space:]]+reopen[[:space:]]*$'; then
            echo "FAIL: $src missing 'on reopen' handler (Branch F.1 §8.7 regression)" >&2
            exit 1
          fi

          # Branch F: the AppleScript MUST invoke /usr/bin/open (or rely
          # on launch-helper.sh which does). Spawning Ghostty's Mach-O
          # directly from a 3rd-party .app prompts for Automation TCC
          # permission (§1.5.4.2 H11). The committed AppleScript delegates
          # to the helper, so we just check the source doesn't reference
          # the Ghostty Mach-O path directly.
          if echo "$stripped" | grep -qE '/Applications/Ghostty\.app/Contents/MacOS/ghostty'; then
            echo "FAIL: $src spawns Ghostty's Mach-O directly (TCC trap — see §1.5.4.2 H11)" >&2
            exit 1
          fi

          # Branch F.1 / §8.7: the helper must capture the spawned
          # ghostty's PID via `pgrep -nf "Ghostty.app/Contents/MacOS/ghostty…"`
          # so the AppleScript `on reopen` handler can resolve which
          # process to focus. A future refactor that drops the pgrep
          # call (e.g. inlining the launch flow back into `exec open`)
          # would silently break the focus feature; this gate surfaces
          # that.
          if ! grep -qF -- 'pgrep -nf "Ghostty.app/Contents/MacOS/ghostty' "$helper"; then
            echo "FAIL: $helper missing PID-capture (Branch F.1 §8.7 regression — pgrep -nf \"Ghostty.app/Contents/MacOS/ghostty…\")" >&2
            exit 1
          fi

          echo "PASS: bundle structure + identity + helper logic + AppleScript regression gates all hold"

      # Cask install: proves the user-facing happy path on a clean Mac.
      # Wrapped in a retry loop because Homebrew cask installs on
      # macos-latest occasionally flake on network / DMG mount. Three
      # attempts with exponential-ish backoff balances "real flakes
      # recover" with "real failures surface within ~3 min".
      - name: Install Ghostty cask
        run: |
          attempt=1
          max=3
          delay=15
          while :; do
            echo "Ghostty cask install attempt $attempt/$max"
            if brew install --cask ghostty; then
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "FAIL: Ghostty cask install failed after $max attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "Retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
          done
          test -d /Applications/Ghostty.app || {
            echo "FAIL: /Applications/Ghostty.app not found after install" >&2
            exit 1
          }
          echo "PASS: Ghostty.app installed"
